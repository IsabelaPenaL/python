{% extends "base.html" %}

{% block conteudo %}
<div class="card cartao-central">
    <div class="icone-topo"><i class="bi bi-pencil-square"></i></div>
    <h3 class="text-center mb-4">Editar Tarefa</h3>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" name="titulo" class="form-control" value="{{ tarefa.titulo }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea name="descricao" class="form-control" rows="3">{{ tarefa.descricao }}</textarea>
        </div>

        <div class="mb-4">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="pendente" {% if tarefa.status == "pendente" %}selected{% endif %}>🟡 Pendente</option>
                <option value="andamento" {% if tarefa.status == "andamento" %}selected{% endif %}>🔵 Em andamento</option>
                <option value="concluida" {% if tarefa.status == "concluida" %}selected{% endif %}>🟢 Concluída</option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">
                <i class="bi bi-check-lg"></i> Atualizar
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary flex-fill">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
