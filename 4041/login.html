{% extends "base.html" %}

{% block conteudo %}
<div class="card cartao-central">
    <div class="icone-topo"><i class="bi bi-person-check"></i></div>
    <h3 class="text-center mb-4">Bem-vindo de volta</h3>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-control" placeholder="voce@email.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="senha" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2">
            <i class="bi bi-box-arrow-in-right"></i> Entrar
        </button>
    </form>
    <p class="text-center mt-4 mb-0" style="font-size: 0.9rem;">
        Não tem conta? <a href="{{ url_for('registro') }}">Cadastre-se aqui</a>
    </p>
</div>
{% endblock %}
