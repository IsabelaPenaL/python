{% extends "base.html" %}

{% block conteudo %}
<div class="card cartao-central">
    <div class="icone-topo"><i class="bi bi-plus-circle"></i></div>
    <h3 class="text-center mb-4">Nova Tarefa</h3>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" name="titulo" class="form-control" placeholder="Ex: Estudar Flask" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea name="descricao" class="form-control" rows="3" placeholder="Detalhes da tarefa..."></textarea>
        </div>

        <div class="mb-4">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="pendente">🟡 Pendente</option>
                <option value="andamento">🔵 Em andamento</option>
                <option value="concluida">🟢 Concluída</option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">
                <i class="bi bi-check-lg"></i> Salvar
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary flex-fill">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
